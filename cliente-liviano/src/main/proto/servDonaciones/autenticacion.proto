syntax = "proto3";

package autenticacion;

option java_multiple_files = true;
option java_package = "com.servDonaciones.authServicegrpc.grpc";

// The greeting service definition.
service AuthService {
  // Sends a greeting
  rpc AutenticarUsuario (LoginRequest) returns (LoginResponse) {}
  rpc GetUsuario (Empty) returns (stream Usuario) {}
  rpc GetUsuarios (Empty) returns (ListUsuarios) {}
}

message Empty {}

message LoginRequest {
  string mail = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
}

message Usuario {
  string mail = 1;
  string rol = 2;
}

message ListUsuarios {
  repeated Usuario usuarios = 1;
}