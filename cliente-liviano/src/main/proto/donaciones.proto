syntax = "proto3";

package donaciones;

option java_multiple_files = true;
option java_package = "ar.edu.utn.frba.dds.grpc";

// Contrato cliente liviano donaciones-mserver
service GestionDonacionesService {
  rpc MarcarVencida (SegmentadaIdRequest) returns (ResultadoOperacion);
  rpc AsignarDonacion (AsignacionRequest) returns (ResultadoOperacion);
  rpc ListarEntidades (ListarEntidadesRequest) returns (ListaEntidadesResponse);
  rpc ObtenerRanking (SegmentadaIdRequest) returns (RankingResponse);
  rpc ListarDonantes (ListarDonantesRequest) returns (ListaDonantesResponse);
  rpc CrearDonacion (CrearDonacionRequest) returns (DonacionCreadaResponse);
  rpc ListarDonacionesDeDonante(DonanteIdRequest) returns (ListaSegmentadasResponse);

  //pantalla 9
  rpc ListarDonacionesAsignadas(EntidadAsignadaRequest) returns (ListaSegmentadasResponse);

}

//pantalla 15
message AsignacionRequest {
  int64 segmentada_id = 1;
  int64 entidad_id = 2;
}

//nombre de las entidades
message ListarEntidadesRequest{}

message EntidadProto {
  int64 id = 1;
  string razon_social = 2;
  string tipo = 3;
  string direccion = 4;
  repeated string mails = 5;
  string telefono = 6;
}

message ListaEntidades {
  repeated EntidadProto entidades = 1;
}

message ListaEntidadesResponse {
  bool exito = 1;
  string mensaje = 2;
  repeated EntidadProto entidades =3;
}
//ranking
message RankingResponse {
  bool exito = 1;
  bool donacion_encontrada = 2;
  string mensaje = 3;
  bool hubo_coincidencias = 4;
  repeated EntidadProto propuestas = 5;
  map<string,ListaEntidades> por_algoritmo = 6;
}

message SegmentadaIdRequest{
  int64 segmentada_id = 1;
}

message ResultadoOperacion {
  bool exito = 1;
  string mensaje = 2;
}

//pantalla 13
message ListarDonantesRequest{}

message DonanteProto{
  int64 id = 1;
  string nombre_identificador = 2;
}

message ListaDonantesResponse {
  bool exito = 1;
  string mensaje = 2;
  repeated DonanteProto donantes = 3;
}

message BienProto {
  string categoria = 1;
  string subcategoria = 2;
  string unidad = 3;
  string cantidad = 4;
  string descripcion = 5;
  string foto = 6;
  string fecha_vencimiento = 7;
  string estado_uso = 8;
}

message CrearDonacionRequest {
  int64 donante_id = 1;
  string descripcion_general = 2;
  repeated BienProto bienes = 3;
}

message DonacionCreadaResponse {
  bool exito = 1;
  string mensaje = 2;
  int64 donacion_id = 3;
}

//pantala 5

message DonanteIdRequest{
  int64 donante_id = 1;
}

message SegmentadaProto {
  int64 id = 1;
  int64 donacion_id = 2;
  string fecha_recepcion = 3;
  string estado = 4;
  string categoria = 5;
  string subcategoria = 6;
  string cantidad = 7;
  string unidad = 8;
  string entidad_asignada = 9;

}

message ListaSegmentadasResponse {
  bool exito = 1;
  string mensaje = 2;
  repeated SegmentadaProto segmentadas = 3;
}

//pantalla 9

message EntidadAsignadaRequest {
  int64 entidad_id = 1;
}
