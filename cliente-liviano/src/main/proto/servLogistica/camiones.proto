syntax = "proto3";

package camiones;

option java_multiple_files = true;
option java_package = "com.servLogistica.camionesServiceGrpc.grpc";

service CamionesService {

}

message Camion {
  string patente = 1;
  double capacidadVolumen = 2;
  double capacidadCarga = 3;
  double altura = 4;
  string estado = 5;
}

message ListCamiones {
  repeated Camion camiones = 1;
}