syntax = "proto3";

package registro;

option java_multiple_files = true;
option java_package = "com.registroServicegrpc.grpc";

service RegistroService {
  rpc RegistrarPersona (RegistroPersonaRequest) returns (RegistroResponse) {}
  rpc RegistrarEntidad (RegistroBeneficiariaRequest) returns (RegistroResponse) {}
  rpc RegistrarUsuario (RegistroUsuarioRequest) returns (RegistroResponse) {}
}

message RegistroUsuarioRequest {
  string mail = 1;
  string password = 2;
  string rol = 3;
}

message RegistroResponse {
  bool exito = 1;
  string mensaje = 2;
}

message RegistroPersonaRequest {
  string tipoPersona = 1;
  string nombreIdentificador = 2;
  string mailDonante = 3;
  string telefonoDonante = 4;
  string medioPreferido = 5;
}

message RegistroBeneficiariaRequest {
  string razonSocial = 1;
  string direccion = 2;
  string mailContacto = 3;
  string telefonoBeneficiario = 4;
}
