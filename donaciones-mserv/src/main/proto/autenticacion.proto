syntax = "proto3";

package autenticacion;

option java_multiple_files = true;
option java_package = "com.authServicegrpc.grpc";

service AuthService {
  rpc AutenticarUsuario (LoginRequest) returns (LoginResponse) {}
  rpc GetUsuario (Empty) returns (Usuario) {}
  rpc GetUsuarios (Empty) returns (ListUsuarios) {}
}

message Empty {}

message LoginRequest {
  string mail = 1;
  string password = 2;
}

message LoginResponse {
  bool exito = 1;
  string mensaje = 2;
  string token = 3;
}

message Usuario {
  string mail = 1;
  string rol = 2;
}

message ListUsuarios {
  repeated Usuario usuarios = 1;
}