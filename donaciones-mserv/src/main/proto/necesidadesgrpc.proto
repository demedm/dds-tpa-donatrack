syntax = "proto3";

option java_multiple_files = true;
option java_package = "ar.edu.utn.frba.dds.grpc";

service NecesidadService {
  rpc CrearNecesidad (CrearNecesidadRequest) returns (NecesidadResponse);
  rpc AgregarPeticion (AgregarPeticionRequest) returns (OperacionNecesidadResponse);
  rpc ListarNecesidadesPorEntidad (EntidadIdRequest) returns (ListaNecesidadesResponse);
  rpc ObtenerNecesidadDetalle (NecesidadIdRequest) returns (NecesidadDetailResponse);
  rpc AgregarAdjunto (AgregarAdjuntoRequest) returns (OperacionNecesidadResponse);
}

message CrearNecesidadRequest {
  int64 entidad_id = 1;
  string descripcion = 2;
  string tipo = 3;
  int32 dias_recurrencia = 4; // 0 si no aplica
}

message NecesidadResponse {
  bool exito = 1;
  string mensaje = 2;
  int64 necesidad_id = 3;
}

message AgregarPeticionRequest {
  int64 necesidad_id = 1;
  string subclase = 2;
  double cantidad_requerida = 3;
}

message OperacionNecesidadResponse {
  bool exito = 1;
  string mensaje = 2;
}

message EntidadIdRequest {
  int64 entidad_id = 1;
}

message NecesidadIdRequest {
  int64 necesidad_id = 1;
}

message PeticionProto {
  int64 id = 1;
  string subclase = 2;
  double cantidad_requerida = 3;
  double cantidad_recibida = 4;
  double cantidad_comprometida = 5;
}

message NecesidadProto {
  int64 id = 1;
  int64 entidad_id = 2;
  string tipo = 3;
  string estado = 4;
  string descripcion = 5;
  int32 dias_recurrencia = 6;
  repeated PeticionProto peticiones = 7;
  string proximo_vencimiento = 8;
  bool esta_vencida = 9;
  repeated string adjuntos = 10;
}

message ListaNecesidadesResponse {
  repeated NecesidadProto necesidades = 1;
}

message NecesidadDetailResponse {
  bool encontrada = 1;
  NecesidadProto necesidad = 2;
}

message AgregarAdjuntoRequest {
  int64 necesidad_id = 1;
  string url = 2;
}