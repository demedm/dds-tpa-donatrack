services:
  db:
    image: mariadb:11
    network_mode: host
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - datos:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  donaciones:
    build:
      context: .
      dockerfile: donaciones-mserv/Dockerfile
    network_mode: host
    environment:
      JWT_SECRET: ${JWT_SECRET}
      MATCHMAKING_JOB_TOKEN: ${MATCHMAKING_JOB_TOKEN}
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  logistica:
    build:
      context: .
      dockerfile: logistica-mserv/Dockerfile
    network_mode: host
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  cliente:
    build:
      context: .
      dockerfile: cliente-liviano/Dockerfile
    network_mode: host
    environment:
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - donaciones
      - logistica
    restart: on-failure

volumes:
  datos: